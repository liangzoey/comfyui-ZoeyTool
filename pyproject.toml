[project]
name = "comfyui-zoeytool"
description = "ComfyUI多功能工具包 - 图像/视频处理、翻译、提示词生成"
version = "1.1.0"
license = { file = "LICENSE.txt" }
dependencies = [
    "torch>=2.0.0",
    "Pillow>=9.0.0",
    "numpy>=1.22.0",
    "opencv-python-headless>=4.5.0",
    "requests>=2.26.0",
    "transformers>=4.30.0",
    "comfyui-extra-nodes>=1.4.0",
    "rembg>=2.0.0",
]

[project.urls]
Repository = "https://github.com/liangzoey/comfyui-ZoeyTool"

[tool.comfy]
PublisherId = "zoeyliangliang"
DisplayName = "ComfyUI-ZoeyTool"
Icon = "https://raw.githubusercontent.com/liangzoey/comfyui-ZoeyTool/main/icon.svg"
